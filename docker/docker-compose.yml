version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: aichatpilot-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: aichatpilot
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-authentication-plugin=caching_sha2_password
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    networks:
      - aichatpilot-net

  redis:
    image: redis:7-alpine
    container_name: aichatpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123456 --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - aichatpilot-net

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: aichatpilot-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      NACOS_AUTH_TOKEN: YWljaGF0cGlsb3QtbmFjb3Mtc2VjcmV0LWtleS1tdXN0LWJlLWxvbmctZW5vdWdo
      JVM_XMS: 256m
      JVM_XMX: 256m
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - aichatpilot-net

  minio:
    image: minio/minio:latest
    container_name: aichatpilot-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - aichatpilot-net

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  minio-data:

networks:
  aichatpilot-net:
    driver: bridge
