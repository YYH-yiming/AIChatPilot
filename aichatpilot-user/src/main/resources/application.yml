server:
  port: 8081

spring:
  application:
    name: aichatpilot-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aichatpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      password: redis123456

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: AIChatPilot-SecretKey-Must-Be-At-Least-32-Bytes!
  expiration: 86400000

# Knife4j 文档
knife4j:
  enable: true
  setting:
    language: zh_cn
