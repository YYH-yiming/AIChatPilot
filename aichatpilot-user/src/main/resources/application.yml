server:
  port: ${USER_SERVER_PORT:8081}

spring:
  application:
    name: aichatpilot-user
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/aichatpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: ${JWT_SECRET:AIChatPilot-SecretKey-Must-Be-At-Least-32-Bytes!}
  expiration: ${JWT_EXPIRATION:86400000}

knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

logging:
  level:
    com.yyh: ${APP_LOG_LEVEL:INFO}
