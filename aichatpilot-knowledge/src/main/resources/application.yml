server:
  port: ${KNOWLEDGE_SERVER_PORT:8082}

spring:
  application:
    name: aichatpilot-knowledge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/aichatpilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE:50MB}
      max-request-size: ${KNOWLEDGE_MAX_REQUEST_SIZE:50MB}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:knowledge-document-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket-name: ${MINIO_BUCKET_NAME:aichatpilot-docs}

embedding:
  api-url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
  api-key: ${EMBEDDING_API_KEY:}
  model: ${EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}

rerank:
  api-url: ${RERANK_API_URL:https://api.siliconflow.cn/v1/rerank}
  api-key: ${RERANK_API_KEY:}
  model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}

llm:
  provider: ${LLM_PROVIDER:ark}
  api-url: ${LLM_API_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  openai-compatible: ${LLM_OPENAI_COMPATIBLE:true}
  temperature: ${LLM_TEMPERATURE:0.3}
  max-tokens: ${LLM_MAX_TOKENS:2048}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USERNAME:}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:default}

knowledge:
  chunk:
    strategy: ${KNOWLEDGE_CHUNK_STRATEGY:fixed}
    size: ${KNOWLEDGE_CHUNK_SIZE:1000}
    overlap: ${KNOWLEDGE_CHUNK_OVERLAP:100}
  async:
    enabled: ${KNOWLEDGE_ASYNC_ENABLED:true}
    document-upload-topic: ${KAFKA_TOPIC_DOCUMENT_UPLOAD:knowledge.document.upload}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    topic-replicas: ${KAFKA_TOPIC_REPLICAS:1}
  retrieval:
    top-k: ${KNOWLEDGE_RETRIEVAL_TOP_K:5}
    rrf-k: ${KNOWLEDGE_RETRIEVAL_RRF_K:60}
    index-on-upload: ${KNOWLEDGE_RETRIEVAL_INDEX_ON_UPLOAD:true}
    fail-on-index-error: ${KNOWLEDGE_RETRIEVAL_FAIL_ON_INDEX_ERROR:false}
    dense-enabled: ${KNOWLEDGE_RETRIEVAL_DENSE_ENABLED:true}
    sparse-enabled: ${KNOWLEDGE_RETRIEVAL_SPARSE_ENABLED:true}
    rerank-enabled: ${KNOWLEDGE_RETRIEVAL_RERANK_ENABLED:true}
    recall-top-n: ${KNOWLEDGE_RETRIEVAL_RECALL_TOP_N:20}
  rag:
    top-k: ${RAG_TOP_K:5}
    empty-answer: ${RAG_EMPTY_ANSWER:我没有在知识库中找到相关信息}
    system-prompt: ${RAG_SYSTEM_PROMPT:}
  faq-cache:
    enabled: ${KNOWLEDGE_FAQ_CACHE_ENABLED:true}
    ttl-minutes: ${KNOWLEDGE_FAQ_CACHE_TTL_MINUTES:30}
    cache-empty-answer: ${KNOWLEDGE_FAQ_CACHE_EMPTY_ANSWER:true}
    key-prefix: ${KNOWLEDGE_FAQ_CACHE_KEY_PREFIX:knowledge:faq-cache}
  upload-lock:
    enabled: ${KNOWLEDGE_UPLOAD_LOCK_ENABLED:true}
    upload-lease-seconds: ${KNOWLEDGE_UPLOAD_LOCK_LEASE_SECONDS:60}
    process-lease-seconds: ${KNOWLEDGE_PROCESS_LOCK_LEASE_SECONDS:600}
    key-prefix: ${KNOWLEDGE_UPLOAD_LOCK_KEY_PREFIX:knowledge:upload-lock}


logging:
  level:
    com.yyh: ${APP_LOG_LEVEL:INFO}
