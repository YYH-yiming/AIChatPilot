server:
  port: ${GATEWAY_SERVER_PORT:8080}

spring:
  application:
    name: aichatpilot-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3000}
        # response-timeout 是 Reactor Netty「两次读之间的 idle 超时」。SSE 长静默（如 agent 整段降级 ~68s）会超 60s 被 reset。
        # 调到 300s 容纳慢 LLM；根治需 SSE 路由单独放宽 + 心跳（P1-5）。默认值也提高，避免 env 未注入时仍用 60s。
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:300s}
      default-filters:
        - PreserveHostHeader

gateway:
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:1}
    requests-per-window: ${GATEWAY_RATE_LIMIT_REQUESTS_PER_WINDOW:40}
    burst-extra-requests: ${GATEWAY_RATE_LIMIT_BURST_EXTRA_REQUESTS:20}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:true}
    route-limits:
      chat-service: ${GATEWAY_RATE_LIMIT_CHAT_SERVICE:20}
      agent-service: ${GATEWAY_RATE_LIMIT_AGENT_SERVICE:15}
      knowledge-service: ${GATEWAY_RATE_LIMIT_KNOWLEDGE_SERVICE:30}

jwt:
  secret: ${JWT_SECRET:AIChatPilot-SecretKey-Must-Be-At-Least-32-Bytes!}

logging:
  level:
    com.yyh: ${APP_LOG_LEVEL:INFO}
